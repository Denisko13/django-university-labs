{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">

        <header>
            <h2>🌙 Магазин Нічників</h2>
            <nav>
                <a href="{% url 'home' %}">🏠 Головна</a>
                <a href="{% url 'page1' %}">ℹ️ Про нас</a>
                <a href="{% url 'page2' %}">📞 Контакти</a>

               <div class="menu-categories">
                   <span>Категорії: </span>
                   {% for cat in categories %}
                       <a href="{% url 'category_detail' cat.id %}" title="{{ cat.name }}">
                            {{ cat.name }}
                       </a>
                    {% endfor %}
               </div>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>&copy; 2026 Всі права захищено. Магазин нічників.</p>
        </footer>

    </div>

</body>
</html>
