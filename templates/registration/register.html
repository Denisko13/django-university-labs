{% extends 'base.html' %}

{% block content %}
<div class="product-detail-container">
    <div class="product-detail-card" style="max-width: 400px; margin: 0 auto;">
        <h1 class="detail-title" style="text-align: center;">📝 Реєстрація</h1>
        <hr style="opacity: 0.1; margin-bottom: 30px;">

        <form method="post" class="add-to-cart-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="cart-btn" style="width: 100%; margin-top: 20px;">Створити акаунт</button>
        </form>
    </div>
</div>
{% endblock %}
