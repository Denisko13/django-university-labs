{% extends 'base.html' %}

{% block content %}
<div class="product-detail-container">
    <div class="product-detail-card" style="max-width: 400px; margin: 0 auto;">
        <h1 class="detail-title" style="text-align: center;">Новий пароль</h1>
        <hr style="opacity: 0.1; margin-bottom: 20px;">

        {% if validlink %}
            <p style="color: #bdc3c7; text-align: center; margin-bottom: 20px;">
                Будь ласка, введіть ваш новий пароль двічі.
            </p>
            <form method="post" class="add-to-cart-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="cart-btn" style="width: 100%; margin-top: 15px;">Зберегти пароль</button>
            </form>
        {% else %}
            <h3 style="color: #e74c3c; text-align: center;">Посилання недійсне!</h3>
            <p style="color: #bdc3c7; text-align: center; margin-top: 15px;">
                Можливо, ви вже використали його. Спробуйте <a href="{% url 'password_reset' %}" style="color: #f1c40f;">запросити нове</a>.
            </p>
        {% endif %}
    </div>
</div>
{% endblock %}
