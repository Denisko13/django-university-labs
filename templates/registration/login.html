{% extends 'base.html' %}

{% block content %}
<div class="product-detail-container">
    <div class="product-detail-card" style="max-width: 400px; margin: 0 auto;">
        <h1 class="detail-title" style="text-align: center;">🔑 Вхід</h1>
        <hr style="opacity: 0.1; margin-bottom: 30px;">

        <form method="post" class="add-to-cart-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="cart-btn" style="width: 100%; margin-top: 20px;">Увійти</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #7f8c8d;">
            Немає акаунту? <a href="{% url 'register' %}" style="color: #f1c40f;">Зареєструватись</a>
        </p>
        <p style="text-align: center; margin-top: 10px;">
            <a href="{% url 'password_reset' %}" style="color: #bdc3c7; font-size: 0.9em;">Забули пароль?</a>
        </p>
    </div>
</div>
{% endblock %}
